<!-- home.component.html — Pathways OI Trust
     Role-aware home screen (D-150). Presentation only.
     No logic beyond simple conditionals — all role decisions are in the component.

     Card order (Phil 2026-07-16, CC-38-22): working cards for EPO/DCS first
     (Initiatives, Action Queue, Activity, Completed Gates), engagement next
     (egg hunt), admin cards after, and not-yet-valuable placeholders last
     (Notifications, OI Library, OI Assistant). Supersedes the D-425/D-429
     append-after-Notifications ordering. -->

<div class="oi-home-screen">

  <!-- Loading state -->
  <div *ngIf="loading" class="oi-home-loading">
    <ion-spinner name="crescent" color="primary"></ion-spinner>
    <p>Loading your workspace…</p>
  </div>

  <!-- No Division — onboarding message (D-150) -->
  <app-onboarding-message-card
    *ngIf="showOnboarding"
    [displayName]="profile?.display_name ?? ''">
  </app-onboarding-message-card>

  <!-- Main card grid — shown only when user has at least one Division -->
  <div *ngIf="showMainCards" class="oi-card-grid">

    <!-- D-423: My Initiatives leads the grid — primary user lens. -->
    <app-my-delivery-cycles-card
      *ngIf="showDeliveryCycles"
      [userId]="profile?.id ?? ''">
    </app-my-delivery-cycles-card>

    <app-my-action-queue-card
      [userId]="profile?.id ?? ''">
    </app-my-action-queue-card>

    <!-- Contract 41: gates on the Initiatives where the viewer is R, C, or I.
         Pull view — approvals owed stay in the Action Queue above. -->
    <app-my-raci-gates-card
      *ngIf="showDeliveryCycles">
    </app-my-raci-gates-card>

    <!-- Contract G8 (D-560): IE-only pending-gates count. Pull summary —
         never merged with the Action Queue above. -->
    <app-all-pending-gates-card
      *ngIf="showAllPendingGates">
    </app-all-pending-gates-card>

    <!-- Contract G10 (D-568 family C): THE one v1 KPI — quarter deploy goal.
         Renders its own empty state when nothing targets this quarter. -->
    <app-quarter-deploy-goal-card
      *ngIf="showDeliveryCycles">
    </app-quarter-deploy-goal-card>

    <app-my-activity-card
      [userId]="profile?.id ?? ''">
    </app-my-activity-card>

    <app-my-completed-gates-card
      [userId]="profile?.id ?? ''">
    </app-my-completed-gates-card>

    <!-- Easter Egg Hunt — all roles (spec §9) -->
    <app-my-easter-eggs-card></app-my-easter-eggs-card>
    <app-community-eggs-card></app-community-eggs-card>

    <!-- Phil + Admin -->
    <app-divisions-card
      *ngIf="showDivisions">
    </app-divisions-card>

    <!-- Admin only -->
    <app-user-management-card
      *ngIf="showUserManagement">
    </app-user-management-card>

    <!-- Phil only -->
    <app-system-health-card
      *ngIf="showSystemHealth">
    </app-system-health-card>

    <!-- Placeholder-value cards — bottom until they carry real content. -->
    <app-my-notifications-card
      [userId]="profile?.id ?? ''">
    </app-my-notifications-card>

    <app-oi-library-card
      [userId]="profile?.id ?? ''">
    </app-oi-library-card>

    <!-- All roles — Chat stub only in Build A (Session 2026-03-29-A) -->
    <app-embedded-chat-card>
    </app-embedded-chat-card>

  </div>

  <!-- Egg spot #1 — Home page footer (EGG_KEYS.HOME_FOOTER) -->
  <div *ngIf="showMainCards" style="text-align:center; padding:18px 0 8px;">
    <app-egg-spot [placementKey]="EGG_KEYS.HOME_FOOTER"></app-egg-spot>
  </div>

</div>
